<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>SUKI Playlist</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  color-scheme: light only;
  --pink: #f5adb8;
  --mint: #bcfbfa;
  --text: #493c42;
  --sub: #aa929c;
  --paper: #ffffff;
}

html,
body {
  margin: 0;
  min-height: 100%;
  color-scheme: light only;
  background-color: #ffffff;
}

body {
  font-family: "박다현체", "Comic Sans MS", "Segoe UI", sans-serif;
  color: #493c42;
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(245,173,184,.32),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(188,251,250,.36),
      transparent 32%
    ),
    linear-gradient(
      135deg,
      #fff6f9 0%,
      #ffffff 50%,
      #f5ffff 100%
    );
}

.page {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 35px 0;
}

header {
  text-align: center;
  margin-bottom: 28px;
}

header h1 {
  margin: 0;
  font-size: 34px;
  color: #493c42;
}

header p {
  color: #aa929c;
  margin: 7px 0 0;
  font-size: 14px;
}

.main {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(340px,.9fr);
  gap: 22px;
  padding: 22px;
  border-radius: 36px;
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(245,173,184,.45);
  box-shadow: 0 18px 50px rgba(110,80,90,.08);
}

.player-card,
.playlist-card {
  background: #ffffff;
  border-radius: 28px;
  box-shadow: 0 12px 30px rgba(80,60,70,.08);
}

.player-card {
  min-width: 0;
  padding: 32px 34px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.disc-wrap {
  width: min(350px,75%);
  aspect-ratio: 1 / 1;
  position: relative;
  flex: 0 0 auto;
  border-radius: 50%;
  padding: 10px;
  background:
    repeating-radial-gradient(
      circle,
      rgba(255,255,255,.35) 0 2px,
      rgba(255,255,255,.05) 2px 5px
    ),
    conic-gradient(
      from 0deg,
      #f5adb8,
      #e9dce6,
      #bcfbfa,
      #dbe7ed,
      #f5adb8
    );
  box-shadow:
    0 16px 30px rgba(80,70,75,.16),
    inset 0 0 0 2px rgba(255,255,255,.5);
  overflow: hidden;
}

.disc {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
  border: 6px solid #ffffff;
  background: #eeeeee;
}

.disc img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  border-radius: 50%;
}

.disc-hole {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #ffffff;
  border: 2px solid rgba(245,173,184,.3);
  box-shadow: 0 3px 8px rgba(0,0,0,.1);
}

.disc-wrap.playing {
  animation: spin 12s linear infinite;
}

@keyframes spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.song-info {
  text-align: center;
  margin-top: 24px;
}

.song-info h2 {
  margin: 0;
  font-size: 24px;
  color: #493c42;
}

.song-info p {
  margin: 7px 0 0;
  color: #aa929c;
  font-size: 15px;
}

.progress-area {
  width: 100%;
  margin-top: 28px;
}

.progress-row {
  display: grid;
  grid-template-columns: 45px 1fr 45px;
  gap: 10px;
  align-items: center;
}

.time {
  font-size: 12px;
  color: #aa929c;
  text-align: center;
}

input[type="range"] {
  width: 100%;
  accent-color: #f5adb8;
  cursor: pointer;
  color-scheme: light;
}

#volume {
  accent-color: #bcfbfa;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-top: 20px;
}

.control-btn {
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 50%;
  background: #ffffff;
  color: #493c42;
  cursor: pointer;
  font-size: 22px;
  box-shadow: 0 8px 20px rgba(90,70,80,.1);
  color-scheme: light;
}

.control-btn:hover {
  transform: scale(1.05);
}

.play-btn {
  width: 72px;
  height: 72px;
  background:
    linear-gradient(
      135deg,
      #f5adb8 0%,
      #f3d5df 50%,
      #bcfbfa 100%
    );
  font-size: 26px;
}

.volume-area {
  width: min(320px,85%);
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}

.playlist-card {
  padding: 28px 20px;
  min-width: 0;
}

.playlist-card h2 {
  margin: 0 8px 18px;
  font-size: 20px;
  color: #493c42;
}

.playlist {
  height: 520px;
  overflow-y: auto;
  padding: 0 8px 0 6px;
}

.playlist::-webkit-scrollbar {
  width: 7px;
}

.playlist::-webkit-scrollbar-thumb {
  background: #f5adb8;
  border-radius: 20px;
}

.track {
  width: 100%;
  min-height: 102px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid rgba(245,173,184,.8);
  border-radius: 22px;
  background: #fff9fb;
  color: #493c42;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color-scheme: light;
}

.track:hover {
  background: #ffffff;
}

.track.active {
  background:
    linear-gradient(
      135deg,
      #ffeef3,
      #efffff
    );
  border-color: #f5adb8;
}

.track img {
  width: 76px;
  height: 76px;
  flex: 0 0 76px;
  object-fit: cover;
  border-radius: 17px;
}

.track-text {
  min-width: 0;
  flex: 1;
}

.track-title {
  font-weight: 700;
  font-size: 15px;
  color: #493c42;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.track-artist {
  margin-top: 5px;
  font-size: 12px;
  color: #aa929c;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.repeat-btn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  flex: 0 0 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  margin-left: auto;
  border: 1px solid rgba(245,173,184,.45);
  border-radius: 50%;
  background: #ffffff;
  color: #aa929c;
  cursor: pointer;
  font-size: 22px;
  line-height: 1;
  font-family: Arial, sans-serif;
  box-shadow: 0 5px 12px rgba(90,70,80,.08);
}

.repeat-btn:hover {
  transform: scale(1.05);
}

.repeat-btn.active {
  background: #f5adb8;
  color: #ffffff;
  border-color: #f5adb8;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: light only;
    --pink: #f5adb8;
    --mint: #bcfbfa;
    --text: #493c42;
    --sub: #aa929c;
    --paper: #ffffff;
  }

  html,
  body {
    background-color: #ffffff !important;
    color: #493c42 !important;
  }

  body {
    background:
      radial-gradient(
        circle at 10% 10%,
        rgba(245,173,184,.32),
        transparent 30%
      ),
      radial-gradient(
        circle at 90% 80%,
        rgba(188,251,250,.36),
        transparent 32%
      ),
      linear-gradient(
        135deg,
        #fff6f9 0%,
        #ffffff 50%,
        #f5ffff 100%
      ) !important;
  }

  .main {
    background: rgba(255,255,255,.96) !important;
    border-color: rgba(245,173,184,.45) !important;
  }

  .player-card,
  .playlist-card {
    background: #ffffff !important;
  }

  .track {
    background: #fff9fb !important;
    color: #493c42 !important;
    border-color: rgba(245,173,184,.8) !important;
  }

  .track.active {
    background:
      linear-gradient(
        135deg,
        #ffeef3,
        #efffff
      ) !important;
    border-color: #f5adb8 !important;
  }

  .control-btn {
    background: #ffffff !important;
    color: #493c42 !important;
  }

  .play-btn {
    background:
      linear-gradient(
        135deg,
        #f5adb8 0%,
        #f3d5df 50%,
        #bcfbfa 100%
      ) !important;
  }

  #volume {
    accent-color: #bcfbfa !important;
  }

  .song-info h2,
  .track-title,
  header h1,
  .playlist-card h2 {
    color: #493c42 !important;
  }

  .song-info p,
  .track-artist,
  header p,
  .time {
    color: #aa929c !important;
  }
}

@media (max-width:850px) {
  .main {
    grid-template-columns: 1fr;
  }

  .disc-wrap {
    width: min(320px,80%);
  }

  .playlist {
    height: 430px;
  }
}

@media (max-width:500px) {
  .page {
    width: calc(100% - 18px);
    padding: 20px 0;
  }

  header h1 {
    font-size: 27px;
  }

  .main {
    padding: 12px;
    border-radius: 26px;
  }

  .player-card {
    padding: 25px 16px;
  }

  .disc-wrap {
    width: min(270px,85%);
  }

  .playlist-card {
    padding: 22px 12px;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <h1>SUKI Playlist</h1>
  <p>~절찬리 추가중~</p>
</header>

<main class="main">

<section class="player-card">

<div class="disc-wrap" id="discWrap">
  <div class="disc">
    <img id="cover" alt="">
  </div>
  <div class="disc-hole"></div>
</div>

<div class="song-info">
  <h2 id="title"></h2>
  <p id="artist"></p>
</div>

<div class="progress-area">
  <div class="progress-row">
    <span class="time" id="currentTime">0:00</span>
    <input id="progress" type="range" min="0" max="100" value="0">
    <span class="time" id="duration">0:00</span>
  </div>
</div>

<div class="controls">
  <button class="control-btn" id="prev" type="button">◀◀</button>
  <button class="control-btn play-btn" id="play" type="button">▶</button>
  <button class="control-btn" id="next" type="button">▶▶</button>
</div>

<div class="volume-area">
  <span>🔊</span>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7">
</div>

</section>

<section class="playlist-card">
  <h2>곡 목록</h2>
  <div class="playlist" id="playlist"></div>
</section>

</main>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const tracks = [
  {
    title: "Pale Blue",
    artist: "Kenshi Yonezu",
    src: "./paleblue.opus",
    cover: "https://i.pinimg.com/736x/32/04/94/32049423111eff0b3cb4f0aa14c4f555.jpg"
  },
  {
    title: "orion",
    artist: "kenshi Yonezu",
    src: "./orion.opus",
    cover: "https://i.pinimg.com/736x/d7/b3/9d/d7b39d3ee857225d529dcce731be3d94.jpg"
  },
  {
    title: "Mela!",
    artist: "Ryoku Shaka",
    src: "./mela.opus",
    cover: "https://i.pinimg.com/736x/55/75/f1/5575f1eb320cdb45d910cb888571cd5f.jpg"
  },
  {
    title: "Lady",
    artist: "Kenshi Yonezu",
    src: "./lady.opus",
    cover: "https://i.pinimg.com/736x/20/fe/9d/20fe9d508e77b39d08bf88fe7306f2da.jpg"
  },
  {
    title: "ヒロインRE♡クエスト",
    artist: "Feat. Kasane Teto, Adachi Rei",
    src: "./heroin.opus",
    cover: "https://i.pinimg.com/736x/8f/56/96/8f5696d5f03bdfebd5e2bf0b3a865562.jpg"
  },
  {
    title: "Kimini 100 Percent",
    artist: "kyari pamyu pamyu",
    src: "./kimini.opus",
    cover: "https://i.pinimg.com/736x/da/6a/6e/da6a6eda6c75ba19d4a54a7ecd6e11b8.jpg"
  },
  {
    title: "最大公約数",
    artist: "RADWIMPS",
    src: "./rad.opus",
    cover: "https://i.pinimg.com/736x/9b/b7/b2/9bb7b2c3b4c2151b343ebe8814eb8630.jpg"
  },
  {
    title: "눈 맞추고, 손 맞대고",
    artist: "Red Velvet",
    src: "./eyes.opus",
    cover: "https://i.pinimg.com/1200x/64/7f/41/647f41fe7c51c8b5e7c8f56e1c76327e.jpg"
  },
  {
    title: "동거",
    artist: "선우정아",
    src: "./inthebed.opus",
    cover: "https://i.pinimg.com/1200x/b8/b0/fd/b8b0fde66f0dab4d9a5ed791fefd1f76.jpg"
  },
  {
    title: "Beyond My Dreams",
    artist: "선우정아",
    src: "./beyond.opus",
    cover: "https://i.pinimg.com/1200x/05/84/3d/05843d4912676bb96d4b0660c6524595.jpg"
  },
  {
    title: "행운을 빌어요",
    artist: "PEPPERTONES",
    src: "./goodluck.opus",
    cover: "https://i.pinimg.com/736x/ff/76/51/ff76513560a93f10b488a316db2e6550.jpg"
  },
  {
    title: "Walking with you",
    artist: "Novelbright",
    src: "./walking.opus",
    cover: "https://i.pinimg.com/1200x/e3/a7/fa/e3a7fa1d84a707ce33445cacacc4508c.jpg"
  },
  {
    title: "Starry Drama",
    artist: "Ryoku Shaka",
    src: "./starry.opus",
    cover: "https://i.pinimg.com/1200x/67/62/29/676229f3e356bcd459b09dc74c88e3ef.jpg"
  }
];

const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const playlist = document.getElementById("playlist");
const playButton = document.getElementById("play");
const prevButton = document.getElementById("prev");
const nextButton = document.getElementById("next");
const progress = document.getElementById("progress");
const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");
const volume = document.getElementById("volume");
const discWrap = document.getElementById("discWrap");

let current = 0;
let repeatTrack = null;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return minutes + ":" + String(secs).padStart(2, "0");
}

function renderPlaylist() {
  playlist.innerHTML = "";

  tracks.forEach(function(track, index) {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "track";

    if (index === current) {
      button.classList.add("active");
    }

    const img = document.createElement("img");
    img.src = track.cover;
    img.alt = "";

    const text = document.createElement("div");
    text.className = "track-text";

    const trackTitle = document.createElement("div");
    trackTitle.className = "track-title";
    trackTitle.textContent = track.title;

    const trackArtist = document.createElement("div");
    trackArtist.className = "track-artist";
    trackArtist.textContent = track.artist;

    text.appendChild(trackTitle);
    text.appendChild(trackArtist);

    const repeatButton = document.createElement("button");
    repeatButton.type = "button";
    repeatButton.className = "repeat-btn";
    repeatButton.textContent = "↻";

    if (repeatTrack === index) {
      repeatButton.classList.add("active");
    }

    repeatButton.onclick = function(event) {
      event.stopPropagation();

      if (repeatTrack === index) {
        repeatTrack = null;
      } else {
        repeatTrack = index;
      }

      audio.loop = repeatTrack === current;
      renderPlaylist();
    };

    button.appendChild(img);
    button.appendChild(text);
    button.appendChild(repeatButton);

    button.onclick = function() {
      loadTrack(index, true);
    };

    playlist.appendChild(button);
  });
}

function loadTrack(index, autoplay) {
  if (index < 0) {
    index = tracks.length - 1;
  }

  if (index >= tracks.length) {
    index = 0;
  }

  current = index;

  const track = tracks[current];

  audio.pause();
  audio.src = track.src;
  audio.loop = repeatTrack === current;
  audio.load();

  cover.src = track.cover;
  title.textContent = track.title;
  artist.textContent = track.artist;

  progress.value = 0;
  currentTimeText.textContent = "0:00";
  durationText.textContent = "0:00";

  renderPlaylist();

  if (autoplay) {
    audio.play().catch(function(error) {
      console.log(error);
    });
  }
}

playButton.onclick = function() {
  if (audio.paused) {
    audio.play().catch(function(error) {
      console.log(error);
    });
  } else {
    audio.pause();
  }
};

prevButton.onclick = function() {
  loadTrack(current - 1, true);
};

nextButton.onclick = function() {
  loadTrack(current + 1, true);
};

audio.addEventListener("play", function() {
  playButton.textContent = "❚❚";
  discWrap.classList.add("playing");
});

audio.addEventListener("pause", function() {
  playButton.textContent = "▶";
  discWrap.classList.remove("playing");
});

audio.addEventListener("loadedmetadata", function() {
  durationText.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", function() {
  currentTimeText.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value =
      (audio.currentTime / audio.duration) * 100;
  }
});

progress.oninput = function(event) {
  if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
    return;
  }

  audio.currentTime =
    audio.duration *
    (Number(event.target.value) / 100);
};

volume.oninput = function(event) {
  audio.volume = Number(event.target.value);
};

audio.addEventListener("ended", function() {
  loadTrack(current + 1, true);
});

audio.volume = Number(volume.value);

loadTrack(0, false);
</script>

</body>
</html>
